name: Eatit
options:
  bundleIdPrefix: com.eatit
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_LANGUAGE_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.eatit.desktop
    MARKETING_VERSION: "3.4.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Eatit/Info.plist
    CODE_SIGN_ENTITLEMENTS: Eatit/Eatit.entitlements
    # 本地 Build & Run 用 Automatic + Apple Development(Xcode 自动管 dev profile)。
    # Archive 上 App Store 时由 apps/macos/ExportOptions-AppStore.plist 的
    # signingStyle=manual + Apple Distribution override(见 archive-and-upload.sh)。
    # ⚠️ v3.4 §A0 总纲红线禁止 "Developer ID Application"(等价 DMG 直分发渠道)
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 469QTH6TU2
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES:Debug build 注入 get-task-allow=true 让
    # LLDB 能 attach;Release/Archive 时 Xcode 本就不会加 get-task-allow(否则 App Store
    # 会 reject)。verify-entitlements.sh 仍校验 SOURCE 文件,不受影响。
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.10.0

targets:
  Eatit:
    type: application
    platform: macOS
    sources:
      - path: Eatit
        excludes:
          - "Resources/**"
      - path: Eatit/Resources/web
        type: folder
    preBuildScripts:
      - name: "Sync Vite Build to Resources/web"
        script: |
          "${SRCROOT}/scripts/sync-web-resources.sh"
        inputFiles:
          - "$(SRCROOT)/scripts/sync-web-resources.sh"
        outputFiles:
          - "$(SRCROOT)/Eatit/Resources/web/index.html"
    postBuildScripts:
      - name: "Verify Entitlements"
        script: |
          "${SRCROOT}/scripts/verify-entitlements.sh"
        inputFiles:
          - "$(SRCROOT)/scripts/verify-entitlements.sh"
          - "$(SRCROOT)/Eatit/Eatit.entitlements"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/verify-entitlements.stamp"
      - name: "Verify Embedded Binary Team ID"
        script: |
          echo "[M1.1.dev placeholder] team-id sweep deferred to M2.3+ when SPM deps land"
    dependencies:
      - package: GRDB
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  EatitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EatitTests
        excludes:
          - "README.md"
    dependencies:
      - target: Eatit
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
