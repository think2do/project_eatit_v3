<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Eatit Desktop</title>
    <style>
      /* Splash shown before React mounts. initBackendUrl() in main.tsx
         blocks the first render for up to ~30s while the bundled backend
         boots; without this the webview is a blank white rectangle on a
         cold launch. React replaces #root on mount and the splash
         vanishes with no cleanup needed. */
      html, body { margin: 0; height: 100%; }
      body { background: #fafaf7; color: #0f1310; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
      .eatit-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
      }
      .eatit-splash-brand {
        font-size: 28px; font-weight: 600;
        letter-spacing: 0.5px; color: #1f6b3a;
      }
      .eatit-splash-hint { font-size: 13px; color: #6b7169; }
      .eatit-splash-spinner {
        width: 22px; height: 22px;
        border: 2px solid #d8d9d1;
        border-top-color: #1f6b3a;
        border-radius: 50%;
        animation: eatit-spin 0.8s linear infinite;
      }
      @keyframes eatit-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // JS console → macOS unified log via diag.log Bridge method。
      // 用 `log show --process Eatit --subsystem com.eatit.desktop.js --last 5m` 看 JS 日志。
      // Bridge call 失败时静默(dev shell / vitest 无 Bridge 时不破坏 console)。
      (function(){
        function send(level, args){
          try {
            var handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.eatit;
            if (!handler) return;
            var msg = Array.prototype.map.call(args, function(a){
              if (typeof a === 'string') return a;
              try { return JSON.stringify(a); } catch { return String(a); }
            }).join(' ');
            handler.postMessage({ id: 'diag-' + Math.random().toString(36).slice(2,8), method: 'diag.log', params: { level: level, msg: msg.slice(0, 4000) } });
          } catch (_) { /* never propagate */ }
        }
        var ow = console.warn.bind(console);
        var oe = console.error.bind(console);
        var ol = console.log.bind(console);
        console.warn = function(){ send('warn', arguments); ow.apply(null, arguments); };
        console.error = function(){ send('error', arguments); oe.apply(null, arguments); };
        // 只把 pipeline-相关的 log 转发,避免噪声
        console.log = function(){
          if (typeof arguments[0] === 'string' && /\[QQ\]|question|prefetch|interview/i.test(arguments[0])) {
            send('log', arguments);
          }
          ol.apply(null, arguments);
        };
        window.addEventListener('error', function(e){
          send('window-error', [(e.message || String(e)), (e.error && e.error.stack) || '']);
        });
        window.addEventListener('unhandledrejection', function(e){
          var r = e.reason;
          send('rejection', [(r && r.message) || String(r), (r && r.stack) || '']);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="eatit-splash">
        <div class="eatit-splash-brand">Eatit</div>
        <div class="eatit-splash-spinner"></div>
        <div class="eatit-splash-hint">正在启动本地服务...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
