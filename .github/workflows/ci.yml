name: ci

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + alembic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/api/uv.lock'

      - name: uv sync
        run: uv sync --frozen

      - name: alembic migrations reachable (head parses)
        run: uv run alembic heads

      - name: pytest
        run: uv run pytest -q

  frontend:
    name: frontend (tsc + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit
        run: pnpm --filter @eatit/desktop exec tsc --noEmit

      - name: eslint
        run: pnpm --filter @eatit/desktop lint

      - name: design-tokens lint (forbid Tailwind default palette + hex)
        run: pnpm --filter @eatit/desktop lint:design-tokens

  tauri:
    name: tauri (cargo check, macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --locked
